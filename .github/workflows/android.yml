name: android

on:
  push:
    branches: [production-ready, main, "ci-scratch/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Decode release keystore (skipped when secret is absent)
        env:
          KEYSTORE_B64: ${{ secrets.SHOTSYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SHOTSYNC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing enabled"
          else
            echo "No keystore secret: building unsigned release"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Release build (APK + AAB)
        env:
          SHOTSYNC_KEYSTORE_PASSWORD: ${{ secrets.SHOTSYNC_KEYSTORE_PASSWORD }}
          SHOTSYNC_KEY_ALIAS: ${{ secrets.SHOTSYNC_KEY_ALIAS }}
          SHOTSYNC_KEY_PASSWORD: ${{ secrets.SHOTSYNC_KEY_PASSWORD }}
          SHOTSYNC_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/
          if-no-files-found: warn
