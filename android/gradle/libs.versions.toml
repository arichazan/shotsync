[versions]
agp = "8.13.2"
kotlin = "2.4.10"
ksp = "2.3.11"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
composeBom = "2026.03.00"
lifecycle = "2.9.4"
room = "2.8.4"
okhttp = "5.4.0"
work = "2.11.2"
datastore = "1.2.1"
coroutines = "1.11.0"
zxing = "4.3.0"
appcompat = "1.7.1"
junit = "4.13.2"
androidxJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
